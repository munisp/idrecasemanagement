# idre login theme: everything inherited from Keycloak 26's keycloak.v2
# (pages, layout, dark mode, PatternFly 5); only the look is changed, in
# css/idre-login.css, from the portal's own colour tokens (portal/css/app.css).
# Select it per realm: Realm settings -> Themes -> Login theme = idre.
# The heading is the realm's Display name (e.g. "idre-dev"), not set here.
parent=keycloak.v2
# Keep the parent's stylesheet; ours loads after it. The number in our file's
# name is bumped on every change: Cloudflare caches theme files by path for
# 30 days, so a changed file under the same name is not seen.
styles=css/styles.css css/idre-login-2.css
