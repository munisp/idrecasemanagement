# Dapr control-plane / sidecar configuration (performance posture).
# Apply: kubectl apply -f configuration.yaml — then reference via pod
# annotation `dapr.io/config: idre-config` on every injected workload.
#
# Dapr resolves a Configuration CR in the SAME namespace as the pod
# referencing it -- this previously said `idre-core`, a namespace that was
# never created (confirmed live: every idre workload actually runs in
# `idre`), so even if this file had been applied, no sidecar could ever
# have found it. The otel endpoint previously pointed at
# `otel-collector.idre-obs:4317`, a namespace+collector that also never
# existed -- confirmed live, this cluster already runs a full shared
# observability stack in namespace `otel` (Prometheus, Grafana, Loki,
# Jaeger, and a real otel-collector), one otel-collector per cluster, not
# one per app. Pointing at it directly means idre's traces land in the
# same Jaeger/Grafana every other app on this cluster already uses.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: idre-config
  namespace: idre
spec:
  tracing:
    # 100% in dev: this cluster's request volume is low enough that full
    # sampling costs nothing meaningful, and a 1% rate (the right call at
    # production scale, which the cost comment below was written for)
    # would mean almost nothing gets traced during actual debugging --
    # revisit before this config is ever reused for a production tenant.
    samplingRate: "1"
    otel:
      endpointAddress: "otel-collector.otel.svc.cluster.local:4317"
      isSecure: false
      protocol: grpc
  # metric (Dapr <=1.12) and metrics (1.13+) are the same spec under two
  # names, kept for version compatibility; neither has a `port` field --
  # confirmed against this cluster's installed CRD schema (the file
  # previously set metrics.port: 9090, which the apiserver rejects with a
  # strict-decoding error, so this Configuration could never be applied at
  # all). The sidecar's metrics port is a pod annotation
  # (dapr.io/metrics-port), not a Configuration field.
  metric:
    enabled: true
    rules: []                   # default low-cardinality Dapr metrics only
  metrics:
    enabled: true
  mtls:
    enabled: true               # sidecar-to-sidecar encryption stays ON
    workloadCertTTL: "24h"
    allowedClockSkew: "15m"
  # ProxySupport dropped entirely rather than declared with enabled: false
  # -- the CRD requires both name AND enabled per entry (strict-decoding
  # error otherwise), and "off unless needed" means not declaring it at
  # all, same practical effect as the Dapr default.
  accessControl:
    defaultAction: deny         # app allowlists (see app-policies)
    trustDomain: "idre.local"
  # version/configuration are required by the CRD even for the built-in
  # kubernetes resolver, which takes no component-specific config.
  nameResolution:
    component: "kubernetes"
    version: "v1"
    configuration: {}
# Sidecar resource + throughput annotations belong on each app's Deployment:
#   dapr.io/sidecar-cpu-request: "100m"
#   dapr.io/sidecar-cpu-limit: "1"
#   dapr.io/sidecar-memory-request: "128Mi"
#   dapr.io/sidecar-memory-limit: "512Mi"
#   dapr.io/sidecar-listen-addresses: "0.0.0.0"
#   dapr.io/max-body-size: "16M"           # document payloads via pub/sub
#   dapr.io/read-buffer-size: "32768"      # larger header/body buffer
#   dapr.io/http-stream-request-body: "true"
#   dapr.io/config: "idre-config"
# Default sidecar limits (250m/100Mi) throttle under bursty pub/sub fan-out —
# the values above are the floor for case-api and the notifier.
