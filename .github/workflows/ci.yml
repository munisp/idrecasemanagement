name: ci
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history — secrets hide in old commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: |
          cd services/case-api-go
          go build ./... && go vet ./cmd/server/ && go test ./cmd/server/
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m compileall -q services/doc-intel-py services/idre-workflows-py \
            services/analytics-py services/outbox-relay-py services/edge-bridge-py \
            services/graph-intel-py services/lettergen-py
          pip install -q pytest
          # check_processor.py's and pipeline.py's own deps (not the full
          # requirements.txt -- that also pulls in docling/paddlepaddle/
          # paddleocr/torch, none of which test_check_processor.py's or
          # test_pipeline.py's pure-function tests need since both modules
          # import those heavy libs lazily inside function bodies, not at
          # module scope; installing them here would make this job minutes
          # slower for no reason). httpx/pyyaml are pipeline.py's own
          # module-level imports -- needed just to collect test_pipeline.py.
          pip install -q numpy opencv-python-headless pytesseract pillow httpx pyyaml
          cd services/doc-intel-py && python -m pytest -q
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q pyyaml
          python - <<'EOF'
          import glob, yaml, sys
          for f in glob.glob('deploy/**/*.yaml', recursive=True) + ['docker-compose.yml']:
              list(yaml.safe_load_all(open(f)))
          print('all deploy YAML parses')
          EOF
