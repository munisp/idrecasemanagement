server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API -> APISIX gateway (OIDC bearer validation happens there)
    location /v1/ {
        proxy_pass http://apisix:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/voice/ {
        proxy_pass http://apisix:9080;
        proxy_set_header Host $host;
    }

    # Public endpoints (no OIDC): stakeholder applications from the landing site.
    location /api/public/ {
        proxy_pass http://apisix:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Landing site owns / and /apply.html; the portal SPA lives at /app.html
    # (hash routing, so unknown-path fallback goes to the portal shell).
    location / {
        try_files $uri $uri/ /app.html;
    }
    location ~* \.(js|css|svg|png|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Security headers (CSP tightened per environment)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
