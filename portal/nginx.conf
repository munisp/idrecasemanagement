server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API -> case-api, direct in-namespace Service DNS. docker-compose proxied
    # through a locally-run apisix; in-cluster there is no per-app APISIX
    # instance (the shared appsec-apisix-dev gateway is the external ingress
    # layer, not something this pod should hairpin through).
    location /v1/ {
        proxy_pass http://case-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/voice/ {
        proxy_pass http://case-api:8080;
        proxy_set_header Host $host;
    }

    # Public endpoints (no OIDC): stakeholder applications from the landing site.
    location /api/public/ {
        proxy_pass http://case-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Landing site owns / and /apply.html; the portal SPA lives at /app.html
    # (hash routing, so unknown-path fallback goes to the portal shell).
    location / {
        try_files $uri $uri/ /app.html;
    }
    # Confirmed twice now (config.js, then app.js): a 1h/4h edge cache on
    # script files means Cloudflare keeps serving a pre-fix bundle to every
    # visitor -- including a fresh incognito session, since this is an edge
    # cache, not a browser one -- for up to max-age after a redeploy. No
    # build pipeline here stamps content hashes into filenames, so there is
    # no safe way to let CDN/browser caching apply to .js/.css while this
    # app is under active iteration. Images/webmanifest are left cacheable;
    # they aren't part of the thing that keeps changing.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store";
    }
    location ~* \.(svg|png|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Security headers (CSP tightened per environment)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
