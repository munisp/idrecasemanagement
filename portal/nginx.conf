server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Visitors who came by plain HTTP go to HTTPS. Cloudflare reaches this pod over plain HTTP either way, so the
    # scheme the visitor used is only in Cloudflare's CF-Visitor header; probes inside the cluster have none.
    if ($http_cf_visitor ~* '"scheme":"http"') {
        return 301 https://$host$request_uri;
    }

    # API -> case-api, direct in-namespace Service DNS. docker-compose proxied
    # through a locally-run apisix; in-cluster there is no per-app APISIX
    # instance (the shared appsec-apisix-dev gateway is the external ingress
    # layer, not something this pod should hairpin through).
    location /v1/ {
        # Staff upload documents through this path (cases/{id}/documents,
        # checks, onboarding). nginx's default body limit is 1 MB, which
        # refused every scan or photo; the API enforces the real 100 MB cap.
        client_max_body_size 110m;
        proxy_pass http://case-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx's default proxy_read_timeout (60s) is shorter than
        # case-api's own 90-180s client timeouts to graph-intel/Ollama
        # (/graph/ask, /copilot/*) -- nginx was returning 504 to the
        # browser while the backend request was still genuinely in
        # flight and would have succeeded. Confirmed live twice: once at
        # 120s (graph/ask took 46s, fine) and again when /copilot/draft
        # took 114s against this same 120s ceiling -- a 6s margin that a
        # slightly slower generation would blow through. Raised to 170s,
        # just under case-api's own 180s ollama client timeout, so
        # case-api's own structured fallback (facts-only response) wins
        # the race instead of nginx cutting the connection first.
        proxy_read_timeout 170s;
        proxy_send_timeout 170s;
    }
    location /api/voice/ {
        proxy_pass http://case-api:8080;
        proxy_set_header Host $host;
    }

    # Public endpoints (no OIDC): stakeholder applications from the landing site.
    location /api/public/ {
        proxy_pass http://case-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Webhooks (no OIDC, signature-verified at case-api itself): Stripe and
    # Mojaloop both call back here. Missing until now -- with no location
    # block, these fell through to the SPA catch-all below, which only
    # serves static files and 405s any POST. A real Stripe webhook call
    # never reached case-api even with STRIPE_WEBHOOK_SECRET configured
    # correctly -- confirmed live (405 from nginx itself, not from the app).
    location /api/webhooks/ {
        proxy_pass http://case-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ShareBox (no OIDC): the Filing Party / Health Plan document-exchange
    # pages (shareLanding, upload, download) -- previously missing here, so
    # every share link fell through to the catch-all below and silently
    # served the portal shell instead of the real page (200, wrong content).
    location /api/share/ {
        proxy_pass http://case-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;
    }

    # Organizations no longer apply to join: old links to the application form go to the TPA registration.
    # absolute_redirect off: a relative Location, so the browser keeps https and the public host (this origin is
    # plain http behind Cloudflare).
    location = /apply.html {
        absolute_redirect off;
        return 301 /dispute.html$is_args$args#register-tpa;
    }
    # Landing site owns / (and the public dispute.html); the portal SPA lives at /app.html
    # (hash routing, so unknown-path fallback goes to the portal shell).
    location / {
        try_files $uri $uri/ /app.html;
    }
    # Confirmed twice now (config.js, then app.js): a 1h/4h edge cache on
    # script files means Cloudflare keeps serving a pre-fix bundle to every
    # visitor -- including a fresh incognito session, since this is an edge
    # cache, not a browser one -- for up to max-age after a redeploy. No
    # build pipeline here stamps content hashes into filenames, so there is
    # no safe way to let CDN/browser caching apply to .js/.css while this
    # app is under active iteration. Images/webmanifest are left cacheable;
    # they aren't part of the thing that keeps changing.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $csp always;
    }
    location ~* \.(svg|png|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $csp always;
    }

    # Security headers. nginx drops these in any location that sets its own add_header, so the two above repeat
    # them. CSP: the portal's own code only (its handlers and styles are inline, hence 'unsafe-inline'), document
    # previews in blob: frames, sign-in at the environment's Keycloak (dev or prod), Cloudflare's own analytics beacon (it injects it), nothing
    # framing it, no plugins.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://keycloak-servers.newfire.app https://keycloak.upi.dev https://cloudflareinsights.com; frame-src 'self' blob: https://keycloak-servers.newfire.app https://keycloak.upi.dev; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://keycloak-servers.newfire.app https://keycloak.upi.dev; frame-ancestors 'none'";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy $csp always;
}
