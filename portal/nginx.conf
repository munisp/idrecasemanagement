server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API -> APISIX gateway (OIDC bearer validation happens there)
    location /v1/ {
        proxy_pass http://apisix:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/voice/ {
        proxy_pass http://apisix:9080;
        proxy_set_header Host $host;
    }

    # SPA fallback + long-cache static assets
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|svg|png|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Security headers (CSP tightened per environment)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
