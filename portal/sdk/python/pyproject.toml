[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idre-tpa"
version = "1.0.0"
description = "Python client for the dispute resolution portal's TPA API: file and follow IDR disputes from your own systems."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[tool.setuptools]
py-modules = ["idre_tpa"]
