<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123B2F" />
  <title>Federal IDRE Portal</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/app.css?v=__BUILD_VERSION__" />
</head>
<body>
  <div id="app">
    <!-- L1 global rail (Meridian shell) -->
    <div id="rail-backdrop"></div>
    <nav id="rail" aria-label="Primary">
      <div class="rail-brand"><span class="rail-mark">ID</span><span class="rail-word">Federal IDRE</span></div>
      <nav id="nav"></nav>
      <div class="rail-foot" id="rail-foot"></div>
    </nav>

    <div id="body">
      <header id="topbar">
        <button id="rail-toggle" class="rail-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
        <span id="tenant-chip"><span class="t-avatar" id="t-avatar">—</span><span class="t-name" id="t-name">…</span></span>
        <span class="gq-wrap"><input id="gq" type="search" placeholder="Search disputes, documents, accounts…  (⌘K)" aria-label="Global search" autocomplete="off" /><div id="gq-drop" class="gq-drop" role="listbox" hidden></div></span>
        <span class="spacer"></span>
        <button id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">☾</button>
        <button id="bell" class="bell" title="Notifications" aria-label="Notifications">🔔<span id="bell-n" class="bell-n"></span></button>
        <span id="whoami"></span>
      </header>
      <main id="view" tabindex="-1"><p class="muted">Loading…</p></main>
    </div>
  </div>
  <script src="/js/config.js?v=__BUILD_VERSION__"></script>
  <script src="/js/auth.js?v=__BUILD_VERSION__"></script>
  <script src="/js/ui.js?v=__BUILD_VERSION__"></script>
  <script src="/js/demo.js?v=__BUILD_VERSION__"></script>
  <script src="/js/api.js?v=__BUILD_VERSION__"></script>
  <script src="/js/views.js?v=__BUILD_VERSION__"></script>
  <script src="/js/crm-views.js?v=__BUILD_VERSION__"></script>
  <script src="/js/palette.js?v=__BUILD_VERSION__"></script>
  <script src="/js/app.js?v=__BUILD_VERSION__"></script>
</body>
</html>
